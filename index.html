<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moving Reflections — Visual Study 01</title>

  <meta property="og:title" content="Moving Reflections">
  <meta property="og:description" content="Visual study 01 · Rhythm & Reflections">
  <meta property="og:image" content="https://nvoynov.github.io/moving-reflections/og-image.jpg">
  <meta property="og:type" content="website">
  
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">
    <header id="header">
      <div class="header-eyebrow">VISUAL STUDY 01</div>
      <h1 class="header-title">MOVING REFLECTIONS</h1>
      <div id="header-subtitle" class="header-subtitle">Autumn Leaves · 1–1–1–3</div>
      <div class="header-divider"></div>
    </header>

    <!-- Панель управления: выбор ритма + регулятор BPM + иконки -->
    <nav id="controls" aria-label="Controls">
      <div class="rhythm-picker">
        <select id="rhythm-select" aria-label="Select Rhythm"></select>
      </div>

      <div class="tempo-picker" title="Tempo (Beats Per Minute)">
        <span class="tempo-label">BPM</span>
        <input type="range" id="bpm-slider" min="60" max="165" step="5" value="110" aria-label="Tempo BPM">
        <span id="bpm-value" class="tempo-value">110</span>
      </div>

      <div class="action-buttons">
        <button id="btn-play-pause" class="icon-btn" title="Play / Pause (Space)">
          <svg id="icon-play" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="6 4 20 12 6 20 6 4"></polygon>
          </svg>
          <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="5" x2="8" y2="19"></line>
            <line x1="16" y1="5" x2="16" y2="19"></line>
          </svg>
        </button>

        <button id="btn-stop" class="icon-btn" title="Stop & Reset">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="5" width="14" height="14"></rect>
          </svg>
        </button>

        <button id="btn-fullscreen" class="icon-btn" title="Fullscreen">
          <svg id="icon-fs-enter" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
          <svg id="icon-fs-exit" class="hidden" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </nav>

    <main id="stage">
      <div id="pulse-frame"></div>
      <img id="frame" src="og-image.jpg" alt="Moving Reflections">
    </main>
  </div>

  <script src="rhythms.js"></script>
  <script src="player.js"></script>
</body>
</html>
